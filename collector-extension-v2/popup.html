<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolektor ePerjadin V2.3</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><h1>Kolektor ePerjadin V2.3</h1></header>
<label for="limit">Batas detail untuk satu proses</label><select id="limit"><option value="5">5 SPD (uji awal)</option><option value="10">10 SPD</option><option value="20">20 SPD (maksimal pilot)</option></select>
<div class="actions"><button id="start" class="primary">Ambil Detail SPD</button><button id="resume" disabled>Lanjutkan</button><button id="stop">Jeda</button></div>
<button id="refresh-existing">Periksa ulang SPD lama</button>
<button id="single">Rekam detail yang terbuka</button>
<button id="index-page">Indeks halaman yang tampil</button>
<button id="index-all">Indeks seluruh halaman kegiatan</button>
<section class="status" aria-live="polite"><strong id="status-title">Belum ada data</strong><span id="status-detail">Gunakan pilot 5 SPD lebih dulu.</span></section>
<div class="actions"><button id="export" disabled>Unduh JSON</button><button id="copy" disabled>Salin JSON</button><button id="csv" disabled>Ringkasan CSV</button></div>
<p class="small">Data hanya disimpan di penyimpanan lokal ekstensi dan baru dipindahkan saat Anda ekspor. Jangan kirim JSON ke pihak lain karena memuat data pegawai.</p>
<button id="clear" class="danger">Hapus data lokal</button>
</main><script src="popup.js"></script></body></html>
